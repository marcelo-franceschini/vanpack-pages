<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>{{site.nao_encontrada.titulo_aba}}</title>
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#FBF8F2" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/src/styles/pages.css" />
  </head>
  <body class="page-shell">
    <header class="hdr">
      <div class="wrap hdr-inner">
        <a class="brand" href="./" aria-label="{{nome}}, início">
          <img src="/brand/vanpack-horizontal.svg" alt="{{nome}}" width="128" height="32" />
        </a>
      </div>
    </header>

    <main class="page-main not-found">
      <p class="not-found-code">Erro 404</p>
      <h1>{{site.nao_encontrada.titulo}}</h1>
      <p>{{site.nao_encontrada.texto}}</p>
      <a class="btn" href="./">{{site.nao_encontrada.voltar}}</a>
    </main>

    <footer class="page-footer">
      <div class="wrap page-footer-inner">
        <span>© {{ano}} {{titular}}</span>
        <a href="./politica-de-privacidade.html">{{site.menu.privacidade}}</a>
      </div>
    </footer>
  </body>
</html>
