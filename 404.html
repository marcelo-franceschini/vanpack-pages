<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{site.nao_encontrada.titulo_aba}}</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      /* a fonte, os tokens da marca e o reset, comuns às três páginas: o build embute aqui */
      @import '/src/base.css';
      body {
        min-height: 100vh;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.5rem;
        text-align: center;
      }
      .card {
        max-width: 32rem;
        padding: 3rem 2rem;
        border-radius: 0.5rem;
        background: var(--tint);
      }
      .logo {
        display: inline-block;
        margin-bottom: 2rem;
      }
      .logo img {
        width: 11.25rem;
        height: auto;
      }
      h1 {
        margin-bottom: 1rem;
        font-size: 2.25rem;
        font-weight: 900;
        letter-spacing: -0.025em;
        line-height: 1.1;
      }
      p {
        margin-bottom: 2rem;
        line-height: 1.5;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 3.5rem;
        padding: 0 2rem;
        border-radius: 0.375rem;
        background: var(--floresta);
        color: var(--papel);
        font: 700 1rem/1 var(--font);
        text-decoration: none;
        transition: background-color 0.2s;
      }
      .btn:hover {
        background: var(--floresta-dark);
        color: var(--papel);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <a class="logo" href="%VITE_SITE_URL%" aria-label="{{nome}} · início">
        <img src="/brand/vanpack-horizontal.svg" alt="" width="180" height="45" />
      </a>
      <h1>{{site.nao_encontrada.titulo}}</h1>
      <p>{{site.nao_encontrada.texto}}</p>
      <a class="btn" href="%VITE_SITE_URL%">{{site.nao_encontrada.voltar}}</a>
    </div>
  </body>
</html>
