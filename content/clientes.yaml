# yaml-language-server: $schema=./schemas/clientes.schema.json
#
# A faixa de logos dos clientes (até 12). Em production só aparece quem tem "autorizado: true", com o
# registro da autorização em docs/provas/<nome em minúsculas, sem acento e com hífens>.md. Em demo
# aparecem todos, e o não autorizado leva o rótulo "Exemplo". O nome não aparece na página: só o logo
# (o "alt" é o texto que o leitor de tela lê).
#
# Para pôr um cliente de verdade, acrescente:
#
#   - nome: "Padaria Real"
#     logo: "padaria-real.svg"       # arquivo SVG em content/clientes/ (até 20 KB); sem logo, aparece o nome
#     alt: "Padaria Real"            # opcional; sem ele, vale o nome
#     autorizado: true
#
# Ponha sempre os textos entre aspas.
#
# Faltam os logos de New Millen, Grupo Arte Visão e Kisabor: os sites deles só têm imagem raster (PNG, JPG),
# que o site não aceita. Entram aqui quando o cliente mandar o SVG oficial.

etiqueta: "Clientes"
titulo: "Quem já pede com a gente"

clientes:
  # logo do site do cliente (biscoite.com.br): o SVG que o próprio site dele usa, só otimizado pelo svgo
  - nome: "Biscoitê"
    logo: "biscoite.svg"
    autorizado: false
