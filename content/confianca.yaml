# yaml-language-server: $schema=./schemas/confianca.schema.json
#
# A faixa "Quem somos" logo depois da história: dados verificáveis da empresa. Cada item some se faltar
# o dado dele; se não sobrar nenhum, a faixa inteira some. O mapa e o telefone da faixa vêm de
# content/empresa.yaml.
#
# Ponha sempre os textos entre aspas. {{cidade}}, {{regiao}} e as outras {{variáveis}} puxam os dados
# da empresa (content/empresa.yaml); {{#se variavel}}trecho{{/se}} só aparece se a variável tiver valor.

cidade: "Fábrica própria em {{cidade_uf}}"
cnpj: "CNPJ {{cnpj}}"
regra_pagamento: "Nunca pedimos pagamento para conta de pessoa física"
anos: "{{anos}} anos de mercado"
pagamento: "Pagamento: {{pagamento}}"
