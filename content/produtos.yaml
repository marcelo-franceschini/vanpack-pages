# yaml-language-server: $schema=./schemas/produtos.schema.json
#
# Os produtos da seção "O que fabricamos", na ordem em que aparecem. Cada um tem um 3D interativo
# no topo do cartão: o "id" escolhe a peça (caixa-normal, corte-e-vinco, divisorias ou chapas).

titulo: "Caixas, divisórias e chapas sob medida"
botao: "Pedir orçamento"

itens:
  - id: caixa-normal
    nome: "Caixa normal"
    mensagem: "Olá! Quero um orçamento de caixas normais."
    peca: "caixa normal fechada"
    texto: "Caixas de papelão ondulado de formato tradicional, com abas que se encontram no centro, fabricadas na medida exata do seu produto."
    especificacoes:
      - "Onda B, C ou BC (parede dupla)"
      - "Kraft natural ou branco"
      - "Lisa ou flexografia até 2 cores"

  - id: corte-e-vinco
    nome: "Corte e vinco"
    mensagem: "Olá! Quero um orçamento de caixas com corte e vinco."
    peca: "caixa com corte e vinco"
    texto: "Caixas com trava, tampa articulada e encaixes precisos sob medida, ideais para e-commerce, kits e apresentação de marca."
    especificacoes:
      - "Montagem por encaixe sem fita"
      - "Kraft ou papel branco"
      - "Impressão externa personalizada"

  - id: divisorias
    nome: "Divisórias, tabuleiros e separadores"
    mensagem: "Olá! Quero um orçamento de divisórias, tabuleiros e separadores."
    peca: "divisórias encaixadas num tabuleiro"
    texto: "Colmeias, tabuleiros e separadores internos que imobilizam peças frágeis, frascos e componentes durante o transporte."
    especificacoes:
      - "Grade sob medida para cada item"
      - "Encaixe de meia altura"
      - "Proteção contra impacto"

  - id: chapas
    nome: "Chapas de papelão ondulado"
    mensagem: "Olá! Quero um orçamento de chapas de papelão ondulado."
    peca: "pilha de chapas de papelão ondulado"
    texto: "Chapas cortadas no formato necessário para forrar paletes, separar camadas de carga e proteger superfícies."
    especificacoes:
      - "Parede simples ou dupla"
      - "Corte no formato do palete"
      - "Kraft reciclado ou virgem"
