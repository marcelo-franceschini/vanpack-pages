# yaml-language-server: $schema=./schemas/provas.schema.json
#
# Depoimentos e nota do Google. Nada entra na página sem "autorizado: true" e o registro da autorização
# em docs/provas/<id>.md. Hoje não há nenhum: a seção "Clientes" mostra só a faixa de logos.
#
# Para pôr um depoimento:
#
#   depoimentos:
#     - id: "padaria-real"
#       citacao: "Caixa sempre do mesmo tamanho e com a nossa marca bem impressa."
#       autor: "Fulana, compras, Padaria Real"
#       autorizado: true
#
# Para pôr a nota do Google (só a nota real do Perfil da Empresa):
#
#   nota_google:
#     valor: 4.8
#     quantidade: 37
#     url: "https://g.page/r/exemplo"
#     autorizado: true

depoimentos: []
nota_google: null
