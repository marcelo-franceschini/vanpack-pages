        border-radius: 6px;
        box-shadow: 0 4px 24px rgb(27 26 23 / 0.06);
      }
      .logo {

        margin-bottom: 2rem;
        color: var(--floresta);

        height: auto;

        font-size: 2.25rem;
        font-weight: 850;
        letter-spacing: -0.02em;
        line-height: 1.1;
        margin-bottom: 1rem;
        color: var(--carvao);
      }
      p {
        color: var(--carvao-muted);
        font-size: 1.125rem;
        line-height: 1.5;
        margin-bottom: 2rem;
      }

        align-items: center;
        justify-content: center;
        min-height: 3.5rem;
        padding: 0 2rem;
        border-radius: 4px;
        background: var(--floresta);
        color: var(--papel);
        font: 700 1rem/1 var(--font);
        text-decoration: none;

      .btn:hover {
