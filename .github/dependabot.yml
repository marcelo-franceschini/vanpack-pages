# Atualizações semanais, uma por assunto. Cada PR passa pelo mesmo CI (lint, testes e paridade visual).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      ferramentas:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # O three.js fica fixo de propósito: uma versão nova pode mudar o desenho da cena 3D (a cena
      # principal é travada por hash, tests/trava-3d.test.mjs). Subir de versão é decisão do dono,
      # com as capturas de paridade comparadas; só correções de segurança entram sozinhas.
      - dependency-name: three
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
