name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Os mesmos lint, build e testes do CI dos pull requests: sem isto verde, nada vai ao ar.
  verificar:
    uses: ./.github/workflows/verificar.yml
    permissions:
      contents: read

  build:
    needs: verificar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Avisa se o site vai ao ar com dados fictícios
        run: |
          if grep -Eq '^VITE_DATA_MODE=demo' .env; then
            echo "::warning::VITE_DATA_MODE=demo: o site vai ao ar com dados fictícios e noindex. Troque para production no go-live (docs/go-live.md)."
          fi
      - run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
