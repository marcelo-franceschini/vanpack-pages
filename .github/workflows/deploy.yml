name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Os mesmos lint, build e testes do CI dos pull requests: sem isto verde, nada vai ao ar.
  verificar:
    uses: ./.github/workflows/verificar.yml
    permissions:
      contents: read

  build:
    needs: verificar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Avisa se o site vai ao ar com dados fictícios
        run: |
          if grep -Eq '^VITE_DATA_MODE=demo' .env; then
            echo "::warning::VITE_DATA_MODE=demo: o site vai ao ar com dados fictícios e noindex. Troque para production no go-live (docs/go-live.md)."
          fi
      - run: npm run build
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
