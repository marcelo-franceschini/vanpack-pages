name: CI

# Valida cada pull request (o deploy continua só na master): a verificação (lint, build e testes de
# navegador) e a paridade visual contra a branch de destino, que roda em paralelo.
# Mudança visual de propósito: ponha o rótulo "muda-visual" no PR; a paridade ainda roda e publica as
# imagens como artefato, mas não reprova. Mudança só na estrutura do HTML (acessibilidade, HTML válido),
# sem mudar o desenho: rótulo "muda-html"; os pixels continuam valendo e o HTML mostra só aviso.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    uses: ./.github/workflows/verificar.yml

  paridade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # a base é o commit de destino do PR (o git archive do script só precisa desse commit)
      - name: Busca a branch de destino
        env:
          BASE: ${{ github.base_ref }}
        run: git fetch --depth=1 origin "$BASE:refs/remotes/origin/$BASE"
      - name: Paridade visual contra a branch de destino
        continue-on-error: ${{ contains(github.event.pull_request.labels.*.name, 'muda-visual') }}
        env:
          BASE: ${{ github.base_ref }}
          CHROME_PATH: /usr/bin/google-chrome-stable
          HTML: ${{ contains(github.event.pull_request.labels.*.name, 'muda-html') && '--html=aviso' || '' }}
        run: npm run audit:paridade -- --base="origin/$BASE" $HTML
      - name: Imagens que mudaram
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: paridade-diferencas
          path: dist-paridade/diferencas
          if-no-files-found: ignore

  # Informativo: não bloqueia o merge (continue-on-error). Mostra no resumo do run o Lighthouse (mobile e
  # desktop, mediana de 3, com os tetos de scripts/audit/lighthouse.mjs) e os bytes do build, para uma
  # regressão de LCP ou de peso aparecer no PR. Vira bloqueante só depois de ver o ruído do runner.
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Bytes do build
        run: |
          {
            echo '### Bytes do build (KB, gzip e brotli)'
            echo '```text'
            node scripts/audit/bundle.mjs
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Lighthouse
        env:
          CHROME_PATH: /usr/bin/google-chrome-stable
        run: node scripts/audit/lighthouse.mjs 3
