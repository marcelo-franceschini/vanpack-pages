name: CI

# Valida cada pull request (o deploy continua só na master): lint, build e testes de navegador.
# O Chrome já vem na imagem do ubuntu-latest; o WebGL roda por software (SwiftShader).
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
        env:
          CHROME_PATH: /usr/bin/google-chrome-stable
