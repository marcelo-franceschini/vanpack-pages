# Teste de fumaça no WebKit (scripts/fumaca-webkit.mjs), só à mão: aba Actions, "Fumaça WebKit", Run
# workflow. Fica fora dos pull requests para não gastar minutos do CI em todo PR.
name: Fumaça WebKit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fumaca:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Instala o WebKit do Playwright
        run: npx playwright-core install --with-deps webkit
      - run: npm run build
      - name: Teste de fumaça no WebKit
        run: node scripts/fumaca-webkit.mjs
