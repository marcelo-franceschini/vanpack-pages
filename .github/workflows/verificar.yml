name: Verificar

# Lint, build e testes de navegador. É chamado pelo CI dos pull requests (ci.yml) e pelo deploy
# (deploy.yml), que só publica depois que isto passa. O Chrome já vem na imagem do ubuntu-latest; o
# WebGL roda por software (SwiftShader).
on:
  workflow_call:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
        env:
          CHROME_PATH: /usr/bin/google-chrome-stable
