name: Verificar

# Lint, build e testes de navegador. É chamado pelo CI dos pull requests (ci.yml) e pelo deploy
# (deploy.yml), que só publica depois que isto passa. O Chrome já vem na imagem do ubuntu-latest; o
# WebGL roda por software (SwiftShader).
on:
  workflow_call:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
        env:
          CHROME_PATH: /usr/bin/google-chrome-stable
