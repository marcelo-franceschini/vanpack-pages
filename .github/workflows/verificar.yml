name: Verificar

# Lint, build e testes de navegador. É chamado pelo CI dos pull requests (ci.yml) e pelo deploy
# (deploy.yml), que só publica depois que isto passa. O Chrome já vem na imagem do ubuntu-latest; o
# WebGL roda por software (SwiftShader).
on:
  workflow_call:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
        env:
          CHROME_PATH: /usr/bin/google-chrome-stable
