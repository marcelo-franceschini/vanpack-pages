<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>{{site.privacidade.titulo}}</title>
    <meta name="description" content="{{site.privacidade.descricao}}" />
    <meta name="theme-color" content="#FBF8F2" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/src/styles/pages.css" />
  </head>
  <body class="page-shell">
    <header class="hdr">
      <div class="wrap hdr-inner">
        <a class="brand" href="./" aria-label="{{nome}}, início">
          <img src="/brand/vanpack-horizontal.svg" alt="{{nome}}" width="128" height="32" />
        </a>
        <a class="text-link" href="./">← {{site.privacidade.voltar}}</a>
      </div>
    </header>

    <main class="page-main prose">
      <!--render:politica-->
    </main>

    <footer class="page-footer">
      <div class="wrap page-footer-inner">
        <span>© {{ano}} {{titular}}</span>
        <a href="./">{{site.privacidade.voltar}}</a>
      </div>
    </footer>
  </body>
</html>
