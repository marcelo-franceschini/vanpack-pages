<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>{{site.privacidade.titulo}}</title>
    <meta name="description" content="{{site.privacidade.descricao}}" />
    <meta name="theme-color" content="#FBF8F2" />
    <meta name="color-scheme" content="light" />
    <link rel="canonical" href="%VITE_SITE_URL%politica-de-privacidade.html" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link
      rel="preload"
      href="/fonts/archivo-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
      fetchpriority="high"
    />
    <style>
      /* a fonte, os tokens da marca e o reset, comuns às três páginas: o build embute aqui */
      @import '/src/base.css';
      .wrap {
        width: 100%;
        max-width: 48rem;
        margin: 0 auto;
        padding: 0 var(--pad);
      }
      .top .wrap {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding-top: 0.75rem;
        padding-bottom: 0.75rem;
      }
      .logo,
      .back {
        display: inline-flex;
        align-items: center;
        min-height: 2.75rem;
        font-weight: 700;
      }
      .logo img {
        height: 2.125rem;
        width: auto;
      }
      main {
        padding: 2.5rem 0 4rem;
      }
      h1 {
        font-size: clamp(2rem, 5vw, 3rem);
        font-weight: 900;
        letter-spacing: -0.025em;
        line-height: 1.05;
        margin-bottom: 1.25rem;
      }
      h2 {
        font-size: 1.5rem;
        font-weight: 800;
        letter-spacing: -0.015em;
        line-height: 1.2;
        margin: 2.5rem 0 0.75rem;
      }
      p + p {
        margin-top: 0.75rem;
      }
      .lead {
        font-size: 1.25rem;
        color: var(--carvao);
      }
      footer {
        background: var(--tint);
        padding: 1.5rem 0 2rem;
        font-size: 1rem;
        color: var(--carvao);
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <a class="skip" href="#conteudo">Pular para o conteúdo</a>

    <header class="top">
      <div class="wrap">
        <a class="logo" href="./" aria-label="{{nome}} · início"
          ><img src="/brand/vanpack-horizontal.svg" alt="" width="136" height="34"
        /></a>
        <a class="back" href="./">{{site.privacidade.voltar}}</a>
      </div>
    </header>

    <main id="conteudo">
      <div class="wrap">
        <!--render:politica-->
      </div>
    </main>

    <footer>
      <div class="wrap">
        <p>© {{ano_atual}} {{titular}}<span data-need="cidade_uf"> · {{cidade_uf}}</span></p>
      </div>
    </footer>
  </body>
</html>
